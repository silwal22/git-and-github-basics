<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopStore</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <div class="brand">ShopStore</div>
      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">Categories</a>
        <a href="#">Deals</a>
        <a href="#">Contact</a>
      </nav>
      <button class="cart-btn">Cart <span id="cart-count">0</span></button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div>
        <p class="eyebrow">Fresh finds for your life</p>
        <h1>Shop top products at great prices</h1>
        <p>Discover handpicked essentials, gadgets, and lifestyle items.</p>
        <button class="primary-btn">Explore now</button>
      </div>
    </section>

    <section class="products-section">
      <div class="section-heading">
        <h2>Featured products</h2>
      </div>
      <div id="product-list" class="product-grid"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
